name: Open badge review
on:
  push:
    branches: [feat/badge-picked-styles-pr-open]
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  open-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const repo = context.repo;
            const result = {run: `https://github.com/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`};
            const head = "feat/badge-picked-styles";
            try {
              const {data: existing} = await github.rest.pulls.list({...repo, state: 'open', head: repo.owner + ':' + head, base: 'main'});
              let pr = existing[0];
              if (!pr) { ({data: pr} = await github.rest.pulls.create({...repo, head, base: 'main', title: "Ship the picked Arctic badges with per-wearer sync and image picker", body: "Supersedes the style list in #22; leave #22 open. Ship only stable looks IDs 0 (official Arctic logo in #2EB1EC), 1 (Ice tile), and 2 (Line tile). Retire the white default, Shield, and badge1\u20133 resources.\n\nKeeps the data-driven image picker, saved selected state, per-wearer looks sync, unknown-to-default fallback, and enlarged 9 GUI px tab badge. Nametags stay 8 font-plane units. Small Line tile art uses a 7/64 outline (1.75 framebuffer px at nametag scale 2; 1.97 px at tab), while the picker retains 3/64. Small textures prefilter at framebuffer scale 2 to preserve official mark tips in both legacy and modern renderers.\n\nAll three records have roleRecolor=true. BLOCKER: neither the specified client/server branch nor current origin/main contains the described role-color provider or badge recoloring hook. No new role system was invented; flake-only role recoloring is not implemented and this change needs that existing path before it is ready to merge.\n\nReal-game evidence: /home/claude/proof/badges-picked/ (1.8.9 and 1.21.11, 1280x720, GUI scale 2, Fancy Fonts off). Offline A wears Ice tile, B wears Line tile; both clients show the other wearer on nametag/tab. Default blue logo, three-image picker with selected state, #22 before shots, after shots, and measurements are included. Tab rectangle: 16x16 -> 18x18 framebuffer px; current blue ink 16x15 on both versions. Nametag drawing stays 8x8 units.\n\nValidation: all 31 Java targets plus Forge rebuilt; all 32 release jars pass current-assets/retired-assets/dev-class checks; cargo fmt, clippy -D warnings, and cargo test --workspace pass; core Java tests and 1.8.9/1.21.11 compile/mixin checks pass. Current main is merged into the feature branch and its client pack is rebuilt from the combined source. The Forge remapper now starts a fresh output archive so retired assets cannot survive incremental builds. Logs are recorded in that proof directory. Badge proof classes live under src/dev and are rejected from release jars/pack. Feature branch only; leave unmerged.\n", draft: true})); }
              result.pr = pr.html_url; result.number = pr.number; result.state = pr.state; result.merged = pr.merged;
            } catch (error) { result.error = error.message; }
            try { if (!result.pr) await github.rest.actions.createWorkflowDispatch({...repo, workflow_id: 'ci.yml', ref: head}); result.ci = result.pr ? 'pull_request' : 'dispatched'; await new Promise(r => setTimeout(r, 20000)); const {data: runs} = await github.rest.actions.listWorkflowRuns({...repo, workflow_id: 'ci.yml', branch: head, per_page: 3}); result.ciRuns = runs.workflow_runs.map(r => ({url:r.html_url, status:r.status, conclusion:r.conclusion})); } catch (error) { result.ciError = error.message; }
            const path = '.badge-review-result.json';
            let sha;
            try { const {data: old} = await github.rest.repos.getContent({...repo, path, ref: "feat/badge-picked-styles-pr-open"}); sha = old.sha; } catch (_) {}
            await github.rest.repos.createOrUpdateFileContents({...repo, path, branch: "feat/badge-picked-styles-pr-open", sha, message: 'Record requested badge review outcome', content: Buffer.from(JSON.stringify(result, null, 2) + '\n').toString('base64')});
            core.info(JSON.stringify(result));
            if (result.error) core.warning(result.error);
