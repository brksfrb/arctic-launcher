name: Inspect badge CI
on:
  push:
    branches: [feat/badge-picked-styles-pr-open]
permissions:
  contents: write
  actions: read
  pull-requests: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const repo=context.repo;
            const {data: run}=await github.rest.actions.getWorkflowRun({...repo,run_id:42800919558});
            const {data: jobs}=await github.rest.actions.listJobsForWorkflowRun({...repo,run_id:run.id,per_page:100});
            const {data: old}=await github.rest.pulls.get({...repo,pull_number:22});
            const result={url:run.html_url,status:run.status,conclusion:run.conclusion,head:run.head_sha,pr22:{url:old.html_url,state:old.state},jobs:jobs.jobs.map(j=>({name:j.name,status:j.status,conclusion:j.conclusion,url:j.html_url}))};
            const path='.badge-ci-status.json';let sha;
            try {const {data: file}=await github.rest.repos.getContent({...repo,path,ref:'feat/badge-picked-styles-pr-open'});sha=file.sha;}catch(_){}
            await github.rest.repos.createOrUpdateFileContents({...repo,path,branch:'feat/badge-picked-styles-pr-open',sha,message:'Record requested badge CI status',content:Buffer.from(JSON.stringify(result,null,2)+'\n').toString('base64')});
