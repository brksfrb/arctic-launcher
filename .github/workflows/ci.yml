name: CI

on:
  push:
    branches: [main]
  pull_request:
  # By hand too, to check a branch without a pull request.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bedrock-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mod/versions/bedrock/offline/package-lock.json
      - run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
        working-directory: mod/versions/bedrock/offline
      - run: npm test
        working-directory: mod/versions/bedrock/offline

  bedrock-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: cargo fmt --manifest-path mod/versions/bedrock/native/Cargo.toml --check
      - run: cargo clippy --manifest-path mod/versions/bedrock/native/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path mod/versions/bedrock/native/Cargo.toml --locked
      - run: python -m pip install imageio-ffmpeg==0.6.0
      - name: Headless offline native renderer, terrain depth and MP4 round trip
        run: |
          $captureFfmpeg = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          python mod/versions/bedrock/build.py --java-home "$env:JAVA_HOME" --game-version 1.26.52 --capture-smoke --ffmpeg "$captureFfmpeg"

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Linux libraries (voice chat's ALSA)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast

  # Every text the launcher and the Arctic Client show is localized, every language complete.
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/i18n_check.py

  # The in-game client: its shared core's tests, then every Minecraft target compiled and
  # its mixin hooks checked against that version's game jar (no game is started).
  mod-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Live video integration tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: chmod +x mod/gradlew && mod/gradlew -p mod/core test

  mod-targets:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: echo "versions=$(jq -c '[.[].build]' mod/targets.json)" >> "$GITHUB_OUTPUT"

  mod:
    needs: mod-targets
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.mod-targets.outputs.versions) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x mod/gradlew && python3 mod/check.py ${{ matrix.version }}
