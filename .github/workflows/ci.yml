name: CI

on:
  push:
    branches: [main]
  pull_request:
  # By hand too, to check a branch without a pull request.
  workflow_dispatch:
    inputs:
      only:
        description: "Only these mod targets (space-separated builds, e.g. 1.14.4); empty: all"
        required: false
        default: ""
      gradle:
        description: "Extra Gradle flags for the mod targets (say --stacktrace)"
        required: false
        default: ""
      probe:
        description: "After checking the mod targets, print a game class (and one method's bytecode): 'net.minecraft.X method'"
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Not when a few mod targets are being checked by hand (the "only" input).
    if: ${{ inputs.only == '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Linux libraries (voice chat's ALSA)
        if: runner.os == 'Linux'
        run: bash .github/scripts/apt-install.sh libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --no-fail-fast --locked

  # Mojang's Java runtimes ship ucrtbase.dll and api-ms-win-*.dll, which the named copy no longer
  # writes (security tools flag that). Prove Java still starts from the named copy without them.
  named-runtime:
    if: ${{ inputs.only == '' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [java-runtime-delta, java-runtime-gamma]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Mojang runtime (cached)
        id: runtime
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mojang/${{ matrix.runtime }}
          key: mojang-${{ matrix.runtime }}-windows-x64-${{ hashFiles('.github/scripts/fetch-java-runtime.ps1') }}
      - name: Download the runtime
        if: steps.runtime.outputs.cache-hit != 'true'
        shell: pwsh
        run: .github/scripts/fetch-java-runtime.ps1 -Name ${{ matrix.runtime }} -Out "$env:RUNNER_TEMP/mojang"
      - name: Trivial class
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/hello"
          echo 'public class Hello { public static void main(String[] a) { System.out.println("hello from java"); } }' > "$RUNNER_TEMP/hello/Hello.java"
          javac --release 17 -d "$RUNNER_TEMP/hello" "$RUNNER_TEMP/hello/Hello.java"
      - name: Start Java from the named copy
        shell: bash
        env:
          ARCTIC_RUNTIME_DIR: ${{ runner.temp }}/mojang/${{ matrix.runtime }}
          ARCTIC_HELLO_DIR: ${{ runner.temp }}/hello
        run: cargo test -p arctic-core --locked named_runtime_without_system_dlls_starts_java -- --ignored --nocapture

  # Every text the launcher and the Arctic Client show is localized, every language complete.
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/i18n_check.py

  # The in-game client: its shared core's tests, then every Minecraft target compiled and
  # its mixin hooks checked against that version's game jar (no game is started).
  mod-core:
    if: ${{ inputs.only == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        env:
          # v2: abandon a cache poisoned by a flaky run (missing gson/kotlin-metadata jars)
          GRADLE_BUILD_ACTION_CACHE_KEY_PREFIX: gradle-v2
      - name: Live video integration tools
        run: bash .github/scripts/apt-install.sh --no-recommends ffmpeg
      - run: python3 -m unittest discover -s mod/tools -p 'test_mixin*.py'
      - run: chmod +x mod/gradlew && mod/gradlew -p mod/core test

  mod-targets:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        env:
          ONLY: ${{ inputs.only }}
        run: echo "versions=$(jq -c --arg only "$ONLY" '[.[].build | . as $b | select($only == "" or ($only | split(" ") | index($b)))]' mod/targets.json)" >> "$GITHUB_OUTPUT"

  mod:
    needs: mod-targets
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.mod-targets.outputs.versions) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        env:
          # v2: abandon a cache poisoned by a flaky run (missing gson/kotlin-metadata jars)
          GRADLE_BUILD_ACTION_CACHE_KEY_PREFIX: gradle-v2
      - name: Compile and check mod hooks
        shell: bash
        run: |
          chmod +x mod/gradlew
          status=0
          python3 mod/check.py ${{ matrix.version }} 2>&1 | tee "$RUNNER_TEMP/mod-check.log" || status=$?
          if [ "$status" != 0 ]; then
            python3 - <<'PYTHON'
          import os
          from pathlib import Path
          tail = Path(os.environ["RUNNER_TEMP"]).joinpath("mod-check.log").read_text(errors="replace")[-7000:]
          tail = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=Mod check failure::" + tail)
          PYTHON
          fi
          exit "$status"
        env:
          # This target's restored cache contains false "missing artifact" entries for
          # published Maven Central jars. Refresh metadata instead of trusting those misses.
          ARCTIC_GRADLE_FLAGS: ${{ matrix.version == '1.8.9' && '--refresh-dependencies' || '' }} ${{ inputs.gradle }}
      - name: Probe a game class
        if: ${{ always() && inputs.probe != '' }}
        env:
          PROBE: ${{ inputs.probe }}
        run: python3 mod/tools/probe.py ${{ matrix.version }} $PROBE

  # Forge 1.8.9 is the same sources remapped to Forge's names, with its own bytecode: a mixin that fits
  # Legacy Fabric's vanilla classes can fail there at startup. Build the jar and check its hooks here.
  forge:
    if: ${{ inputs.only == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        env:
          # v2: abandon a cache poisoned by a flaky run (missing gson/kotlin-metadata jars)
          GRADLE_BUILD_ACTION_CACHE_KEY_PREFIX: gradle-v2
      - run: chmod +x mod/gradlew
      # The 1.8.9 build primes Gradle's cache (game jar, Yarn) that the Forge build remaps against.
      - run: python3 mod/build.py 1.8.9 forge-1.8.9 --jobs 1
      - run: python3 mod/check.py forge-1.8.9
      - uses: actions/upload-artifact@v4
        with:
          name: arctic-forge-1.8.9
          path: mod/dist/arctic-forge-1.8.9.jar
          if-no-files-found: error
