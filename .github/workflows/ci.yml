name: CI

on:
  push:
    branches: [main]
  pull_request:
  # By hand too, to check a branch without a pull request.
  workflow_dispatch:
    inputs:
      only:
        description: "Only these mod targets (space-separated builds, e.g. 1.14.4); empty: all"
        required: false
        default: ""
      gradle:
        description: "Extra Gradle flags for the mod targets (say --stacktrace)"
        required: false
        default: ""
      probe:
        description: "After checking the mod targets, print a game class (and one method's bytecode): 'net.minecraft.X method'"
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Not when a few mod targets are being checked by hand (the "only" input).
    if: ${{ inputs.only == '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Linux libraries (voice chat's ALSA)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast

  # The in-game client: its shared core's tests, then every Minecraft target compiled and
  # its mixin hooks checked against that version's game jar (no game is started).
  mod-core:
    if: ${{ inputs.only == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Live video integration tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: chmod +x mod/gradlew && mod/gradlew -p mod/core test

  mod-targets:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        env:
          ONLY: ${{ inputs.only }}
        run: echo "versions=$(jq -c --arg only "$ONLY" '[.[].build | . as $b | select($only == "" or ($only | split(" ") | index($b)))]' mod/targets.json)" >> "$GITHUB_OUTPUT"

  mod:
    needs: mod-targets
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.mod-targets.outputs.versions) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x mod/gradlew && python3 mod/check.py ${{ matrix.version }}
        env:
          ARCTIC_GRADLE_FLAGS: ${{ inputs.gradle }}
      - name: Probe a game class
        if: ${{ always() && inputs.probe != '' }}
        env:
          PROBE: ${{ inputs.probe }}
        run: python3 mod/tools/probe.py ${{ matrix.version }} $PROBE
