name: Replay audio test

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, linux, x64, ryzen]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build test clients and launcher
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mod/gradlew
          # The launcher validates that its embedded bundle has every supported target.
          python3 mod/build.py --jobs 4
          export CARGO_TARGET_DIR="$HOME/arctic-target"
          cargo build --release --locked -p arctic-cli
          mkdir audio-test-bin
          cp "$CARGO_TARGET_DIR/release/arctic" audio-test-bin/
          cp mod/dist/arctic-client.pack audio-test-bin/
      - uses: actions/upload-artifact@v4
        with:
          name: replay-audio-bin
          path: audio-test-bin/
          retention-days: 3
  game:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: replay-audio-bin
          path: audio-test-bin
      - name: Test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth x11-xserver-utils libgl1-mesa-dri libasound2t64 pulseaudio libflite1 ffmpeg
          chmod +x audio-test-bin/arctic
      - name: Record and export audible clips
        run: xvfb-run -a -s '-screen 0 1280x800x24' bash packaging/replay-audio-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-audio-results
          path: audio-test-results/
          retention-days: 7
