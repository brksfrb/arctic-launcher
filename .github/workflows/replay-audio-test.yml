name: Replay audio test

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: 'Reuse replay-audio-bin from this run (blank rebuilds on Ryzen)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: inputs.build_run == ''
    runs-on: [self-hosted, linux, x64, ryzen]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build test clients and launcher
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mod/gradlew
          # The launcher validates that its embedded bundle has every supported target.
          python3 mod/build.py --jobs 4
          export CARGO_TARGET_DIR="$HOME/arctic-target"
          cargo build --release --locked -p arctic-cli
          mkdir audio-test-bin
          cp "$CARGO_TARGET_DIR/release/arctic" audio-test-bin/
          cp mod/dist/arctic-client.pack audio-test-bin/
      - name: Build Windows test candidate
        env:
          ARCTIC_MSA_CLIENT_ID: ${{ secrets.ARCTIC_MSA_CLIENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$HOME/arctic-target"
          cargo xwin build --release --locked --target x86_64-pc-windows-msvc -p arctic-app -p arctic-cli
          mkdir windows-test
          cp "$CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release/arctic-launcher.exe" windows-test/arctic-launcher-windows-x64.exe
          cp "$CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release/arctic.exe" windows-test/arctic-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: replay-audio-windows
          path: windows-test/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: replay-audio-bin
          path: audio-test-bin/
          retention-days: 3
  game:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || inputs.build_run != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: replay-audio-bin
          path: audio-test-bin
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run || github.run_id }}
      - name: Test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth x11-xserver-utils libgl1-mesa-dri mesa-vulkan-drivers vulkan-tools mesa-utils libasound2t64 pulseaudio libflite1 ffmpeg
          chmod +x audio-test-bin/arctic
      - name: Record and export audible clips
        run: xvfb-run -a -s '-screen 0 1280x800x24' bash packaging/replay-audio-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-audio-results
          path: audio-test-results/
          retention-days: 7
