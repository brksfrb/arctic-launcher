name: Deploy cosmetics server

# When the cosmetics server (or Cargo.lock) changes on main, build its image, push it to
# ghcr.io/brksfrb/arctic-launcher/cosmetics and roll it out to cosmetics.arcticlauncher.com.
# Uses the run's own GITHUB_TOKEN for the registry; the rollout goes over a deploy-only SSH key
# that can do nothing on the server except queue this one deploy.

on:
  push:
    branches: [main]
    paths:
      - "crates/arctic-cosmetics/**"
      - "Cargo.lock"
  workflow_dispatch: {}

concurrency:
  group: cosmetics-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/brksfrb/arctic-launcher/cosmetics

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/arctic-cosmetics/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=cosmetics
          cache-to: type=gha,scope=cosmetics,mode=max

      - name: Roll out
        env:
          KEY: ${{ secrets.COSMETICS_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$KEY" ] || [ -z "$HOST" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::warning::Deploy secrets are not set; the image is pushed but not rolled out."
            exit 0
          fi
          install -m 600 /dev/null key && printf '%s\n' "$KEY" > key
          printf '%s\n' "$KNOWN_HOSTS" > known_hosts
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=known_hosts -o ConnectTimeout=25 -i key root@"$HOST" deploy
