name: Release

on:
  push:
    tags: ["v*"]
    # Builds on main (never published) keep a warm cache there: a tag's run
    # can only restore caches from its own tag or the default branch.
    branches: [main]
    paths: ["Cargo.lock", ".github/workflows/release.yml"]
  # GitHub drops caches unused for 7 days; releases come less often.
  schedule:
    - cron: "17 4 */3 * *"
  # By hand: build everything (test builds, like the Mac app) without publishing.
  workflow_dispatch: {}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            launcher: target/release/arctic-launcher.exe
            cli: target/release/arctic.exe
            launcher_asset: arctic-launcher-windows-x64.exe
            cli_asset: arctic-windows-x64.exe
          - os: ubuntu-latest
            launcher: target/release/arctic-launcher
            cli: target/release/arctic
            launcher_asset: arctic-launcher-linux-x64
            cli_asset: arctic-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries (voice chat's ALSA)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }

      - name: Test
        run: cargo test --workspace

      - name: Build
        env:
          # Arctic's own Azure client ID (see docs/microsoft-auth.md). Minecraft
          # sign-in works once Mojang has approved it; no rebuild needed then.
          ARCTIC_MSA_CLIENT_ID: ${{ secrets.ARCTIC_MSA_CLIENT_ID }}
        run: cargo build --release -p arctic-app -p arctic-cli

      - name: Stage assets
        shell: bash
        run: |
          mkdir dist
          cp "${{ matrix.launcher }}" "dist/${{ matrix.launcher_asset }}"
          cp "${{ matrix.cli }}" "dist/${{ matrix.cli_asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: dist/*

  # One app for Apple Silicon and Intel Macs.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }

      - name: Test
        run: cargo test --workspace

      - name: Build
        env:
          ARCTIC_MSA_CLIENT_ID: ${{ secrets.ARCTIC_MSA_CLIENT_ID }}
        run: |
          cargo build --release -p arctic-app -p arctic-cli --target aarch64-apple-darwin
          cargo build --release -p arctic-app -p arctic-cli --target x86_64-apple-darwin

      - name: Package
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          bash packaging/macos/make-app.sh "$version"
          mkdir mac-dist
          cp dist/arctic-launcher-macos.zip dist/arctic-launcher-macos dist/arctic-macos mac-dist/

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: mac-dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x dist/*linux* dist/arctic-launcher-macos dist/arctic-macos
          # Checksums, so a download can be checked: a file next to the
          # downloads and a table at the top of the notes.
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          {
            echo "### SHA-256"
            echo
            echo "| File | SHA-256 |"
            echo "|---|---|"
            while read -r hash name; do name=${name#\*}; echo "| \`$name\` | \`$hash\` |"; done < dist/SHA256SUMS.txt
            echo
            echo "Check a download: \`Get-FileHash <file>\` (PowerShell) or \`sha256sum -c SHA256SUMS.txt\` (Linux)."
          } > notes.md
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "Arctic Launcher $GITHUB_REF_NAME" --notes-file notes.md --generate-notes $prerelease
