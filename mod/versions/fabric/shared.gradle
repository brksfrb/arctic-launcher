// The version preprocessing and mixin switches shared by the Fabric adapter (common.gradle) and
// the NeoForge one (../neoforge/build.gradle): both build the same sources.
def mc = project.minecraft_version
// The CTM development scene and its startup call are opt-in (-Pdevelopment_scenes=true).
def developmentScenes = project.findProperty('development_scenes') == 'true'
// -Pplatform=neoforge: the NeoForge adapter (code for it sits in //#if NEOFORGE blocks).
def neoforge = project.findProperty('platform') == 'neoforge'

/** Minecraft version as numbers, for comparing (26.1.2 → [26, 1, 2]). */
def parseVersion = { String v -> v.tokenize('.').collect { it as int } }

def compareVersions = { String a, String b ->
	def x = parseVersion(a)
	def y = parseVersion(b)
	for (int i = 0; i < Math.max(x.size(), y.size()); i++) {
		int d = (i < x.size() ? x[i] : 0) <=> (i < y.size() ? y[i] : 0)
		if (d != 0) {
			return d
		}
	}
	return 0
}

def atLeast = { String v -> compareVersions(mc, v) >= 0 }

/** "MC >= 26.1 && MC < 26.3": comparisons joined by && or ||. */
def evalCondition
evalCondition = { String expr ->
	if (expr == 'DEV') return project.findProperty('chatcopyDev') == 'true'
	if (expr.trim() == 'DEV_SCENES') return developmentScenes
	if (expr.contains('||')) {
		return expr.split(/\|\|/).any { evalCondition(it.trim()) }
	}
	return expr.split('&&').every { part ->
		if (part.trim() == 'NEOFORGE') return neoforge
		def m = part.trim() =~ /^MC\s*(>=|<=|==|!=|>|<)\s*([0-9.]+)$/
		if (!m.matches()) {
			throw new GradleException("bad //#if condition: ${part.trim()}")
		}
		int c = compareVersions(mc, m.group(2))
		switch (m.group(1)) {
			case '>=': return c >= 0
			case '<=': return c <= 0
			case '>': return c > 0
			case '<': return c < 0
			case '==': return c == 0
			default: return c != 0
		}
	}
}

/** Keep the lines of active //#if branches; drop the rest. */
def preprocessSource = { String text, String name ->
	def out = new StringBuilder()
	def stack = [] // each: [active, anyBranchTaken]
	text.eachLine { line ->
		def t = line.trim()
		boolean outerActive = stack.every { it[0] }
		if (t.startsWith('//#if ')) {
			boolean on = outerActive && evalCondition(t.substring(6))
			stack << [on, on]
		} else if (t.startsWith('//#elif ')) {
			def top = stack.last()
			boolean parent = stack.size() == 1 || stack[0..-2].every { it[0] }
			boolean on = parent && !top[1] && evalCondition(t.substring(8))
			top[0] = on
			top[1] = top[1] || on
		} else if (t == '//#else') {
			def top = stack.last()
			boolean parent = stack.size() == 1 || stack[0..-2].every { it[0] }
			top[0] = parent && !top[1]
			top[1] = true
		} else if (t == '//#endif') {
			if (stack.isEmpty()) {
				throw new GradleException("stray //#endif in ${name}")
			}
			stack.removeLast()
		} else if (outerActive) {
			out.append(line).append('\n')
			return
		}
		// Keep line numbers stable for compiler errors.
		out.append('\n')
	}
	if (!stack.isEmpty()) {
		throw new GradleException("unclosed //#if in ${name}")
	}
	return out.toString()
}

/**
 * Names Minecraft renamed, as [condition, today's name, the name then]:
 * sources use today's names and older builds get the old ones.
 */
def renames = [
		['MC < 26.1', 'GuiGraphicsExtractor', 'GuiGraphics'],
		['MC < 26.1', 'extractRenderState', 'render'],
		['MC < 26.1', 'extractLines', 'renderLines'],
		['MC < 26.2', 'submitHandsWithItems', 'renderHandsWithItems'],
		['MC < 26.1', 'extractBackground', 'renderBackground'],
		['MC < 26.1', 'extractPanorama', 'renderPanorama'],
		['MC < 26.1', 'extractDefaultSprite', 'renderDefaultSprite'],
		['MC < 26.1', 'extractWidgetRenderState', 'renderWidget'],
		['MC < 26.1', 'extractContents', 'renderContents'],
		['MC < 26.1', 'ContainerInput', 'ClickType'],
		['MC < 26.1', 'extractSlot', 'renderSlot'],
		['MC < 1.21.11', 'Identifier', 'ResourceLocation'],
		// Before 1.20 there was no GuiGraphics: a stand-in wraps the PoseStack.
		['MC < 1.20', 'net.minecraft.client.gui.GuiGraphics', 'com.arcticlauncher.mod.compat.GuiGraphics'],
		// Map colors were "material colors" before 1.20.
		['MC < 1.20', 'MapColor', 'MaterialColor'],
		// The key binds had no screen of their own before 1.18 (they were the Controls screen).
		['MC < 1.18', 'KeyBindsScreen', 'ControlsScreen'],
		['MC < 1.17', 'addRenderableWidget', 'addButton'],
		// Before 1.16 texts were mutable Components, and packs "unopened packs".
		['MC < 1.16', 'MutableComponent', 'Component'],
		['MC < 1.16', 'net.minecraft.server.packs.repository.Pack', 'net.minecraft.server.packs.repository.UnopenedPack'],
		// The static registries moved to BuiltInRegistries in 1.19.3.
		['MC < 1.19.3', 'net.minecraft.core.registries.BuiltInRegistries', 'net.minecraft.core.Registry'],
		['MC < 1.19.3', 'BuiltInRegistries', 'Registry'],
		// 1.14 (official names exist from 1.14.4): the client level, the sneak key and input were named differently.
		['MC < 1.15', 'ClientLevel', 'MultiPlayerLevel'],
		['MC < 1.15', 'keyShift', 'keySneak'],
		['MC < 1.15', 'shiftKeyDown', 'sneakKeyDown'],
		['MC < 1.15', 'isShiftKeyDown', 'isSneaking'],
		['MC < 1.14', 'isSameThread', 'isOnThread'],
		// SoundEngine's channel map has no name in the 1.13 mappings.
		['MC < 1.14', 'instanceToChannel', 'field_8196'],
		['MC < 1.14', 'net.minecraft.network.protocol.game.ClientboundRespawnPacket', 'net.minecraft.network.packet.s2c.play.PlayerRespawnS2CPacket'],
		['MC < 1.14', 'ClientboundRespawnPacket', 'PlayerRespawnS2CPacket'],
		['MC < 1.14', 'isVisuallySwimming', 'isSwimming'],
		// 1.13: one widget class (Legacy Yarn's ButtonWidget) where 1.14 has AbstractWidget and Button.
		['MC < 1.14', 'net.minecraft.client.gui.components.AbstractWidget', 'net.minecraft.client.gui.widget.ButtonWidget'],
		['MC < 1.14', 'net.minecraft.client.gui.components.Button', 'net.minecraft.client.gui.widget.ButtonWidget'],
		['MC < 1.14', 'AbstractWidget', 'ButtonWidget'],
		['MC < 1.14', 'Button', 'ButtonWidget'],
		['MC < 1.15', 'setShiftKeyDown', 'setSneaking'],
]

/** Rewrites that need a pattern, as [condition, regex, replacement], applied after the names above. */
def patternRenames = [
		// 1.14 keeps the window in a field; Window's own getWindow() is the native handle.
		['MC < 1.15', /\.getWindow\(\)(?=\.getWindow\(\))/, '.window'],
		['MC < 1.15', /(?<!window)\.getWindow\(\)/, '.window'],
		// 1.13: the inventory and its slots, a model without type parameters.
		['MC < 1.14', /\.getContainerSize\(/, '.getInvSize('],
		['MC < 1.14', /(?<![A-Za-z0-9_])inventory\.getItem\(/, 'inventory.getInvStack('],
		['MC < 1.14', /\.getItem\(slot\)/, '.getInvStack(slot)'],
		['MC < 1.14', /level\.getEntity\(/, 'level.getEntityById('],
		['MC < 1.14', /([A-Za-z.]+)\.copyFrom\(([^;]+)\);/, 'com.arcticlauncher.mod.Compat.copyPart($1, $2);'],
		['MC < 1.14', /HumanoidModel<\?>/, 'HumanoidModel'],
		['MC < 1.14', /PlayerModel<AbstractClientPlayer>/, 'PlayerModel'],
		// 1.13's NativeImage and DynamicTexture close through AutoCloseable (their own close() isn't named).
		['MC < 1.14', /(?<![A-Za-z0-9_])(image|texture)\.close\(\)/, 'com.arcticlauncher.mod.Compat.closeQuietly($1)'],
		// 1.13 runs a task on the game's thread with submit(Runnable) (execute takes a Callable there).
		['MC < 1.14', /(?<!TIMER)\.execute\(/, '.submit('],
]

def applyRenames = { String text ->
	def named = renames.findAll { evalCondition(it[0]) }.inject(text) { t, r ->
		t.replaceAll('(?<![A-Za-z0-9_])' + r[1] + '(?![A-Za-z0-9_])', r[2])
	}
	patternRenames.findAll { evalCondition(it[0]) }.inject(named) { t, r ->
		t.replaceAll(r[1], r[2])
	}
}

/** The Java the game runs on for this version. */
def javaVersion = atLeast('26.1') ? 25 : atLeast('1.20.5') ? 21 : atLeast('1.18') ? 17 : atLeast('1.17') ? 16 : 8

ext.arcticAtLeast = atLeast
ext.arcticJavaVersion = javaVersion
/** One source file, with only this version's code and names. */
ext.arcticPreprocessText = { String text, String name -> applyRenames(preprocessSource(text, name)) }

/**
 * Writes the Java files under each of `roots`, preprocessed, into `outDir`. A file in a later
 * root replaces the one at the same path in an earlier root (the NeoForge adapter's own classes).
 */
ext.arcticPreprocess = { File outDir, List<File> roots ->
	project.delete(outDir)
	roots.each { root ->
		root.eachFileRecurse(groovy.io.FileType.FILES) { f ->
			def rel = root.toPath().relativize(f.toPath()).toString()
			if (!developmentScenes && (f.name.endsWith('Test.java') || f.name.endsWith('Proof.java') || f.name in ['HotbarScrollCheck.java', 'LegacyHotbarScrollCheck.java'])) return
			def target = new File(outDir, rel)
			target.parentFile.mkdirs()
			target.text = applyRenames(preprocessSource(f.getText('UTF-8'), rel))
		}
	}
}

/** The client's resources as this version needs them (`task`: processResources). */
ext.arcticResources = { task ->
	// GlyphProviderBuilderType gains SPACE in 1.19. Keep the bitmap providers;
	// BadgeSpaceMixin supplies the same invisible advances on older clients.
	if (!atLeast('1.19')) {
		task.doLast {
			project.fileTree(task.destinationDir).matching { include 'assets/**/font/*.json' }.each { f ->
				def data = new groovy.json.JsonSlurper().parse(f)
				if (data.providers?.removeAll { it.type == 'space' }) {
					f.text = groovy.json.JsonOutput.toJson(data)
				}
			}
		}
	}
	// Fabric Loader alone does not expose a mod's assets to Minecraft. The client
	// pack is always enabled on these versions, even without Fabric Resource Loader
	// (e.g. performance mods off). Publish the badge fonts and their pictures there
	// too, from the same sources, so name tags never fall back to missing glyphs.
	if (atLeast('1.21.6')) {
		task.from('../../core/src/main/resources') {
			include 'assets/arctic/font/*.json'
			include 'assets/arctic/textures/font/*.png'
			into 'resourcepacks/client'
		}
	}
	// The resource packs are 26.1+ (the effects pack 1.21.6+); older builds keep only the smooth font's
	// Inter (and its licence).
	if (!atLeast('1.21.6')) {
		task.exclude 'resourcepacks/client/**'
	}
	if (!atLeast('26.1')) {
		task.exclude 'resourcepacks/smooth_font/pack.mcmeta'
		task.exclude 'resourcepacks/smooth_font/assets/minecraft/**'
		task.exclude 'resourcepacks/smooth_font/assets/arctic/font/*.json'
	}
}

