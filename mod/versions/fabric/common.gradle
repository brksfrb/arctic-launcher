// The Fabric adapter's build, shared by versions/fabric and versions/fabric13 (see their build.gradle).
// One source tree for every Fabric version of Minecraft. Pick the version
// with -Pminecraft_version=1.21.11; code that differs between versions sits
// in //#if MC >= 26.1 … //#else … //#endif blocks (see shared.gradle).
def mc = project.minecraft_version
// The sources and resources live in versions/fabric; versions/fabric13 builds them from its own folder.
def adapterRoot = project.hasProperty('adapter_root') ? file(project.adapter_root) : projectDir

// Version comparisons, the //#if preprocessor and the mixin switches.
apply from: new File(buildscript.sourceFile.parentFile, 'shared.gradle')
def atLeast = arcticAtLeast

apply plugin: atLeast('26.1') ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'
if (project.hasProperty('legacy_fabric')) {
	apply plugin: 'legacy-looming'
}

def preprocessedJava = layout.buildDirectory.dir("preprocessed/${mc}/java")

tasks.register('preprocessJava') {
	inputs.dir new File(adapterRoot, 'src/main/java')
	inputs.property 'minecraft_version', mc
	outputs.dir preprocessedJava
	// Cheap, and the rules live in shared.gradle: always regenerate.
	outputs.upToDateWhen { false }
	doLast {
		// Proof harnesses are opt-in; mod/build.py always forces this off for releases.
		def roots = ['src/main/java']
		if (project.findProperty('chatcopyDev') == 'true') roots += ['src/dev/java', '../../core/src/dev/java']
		arcticPreprocess(preprocessedJava.get().asFile, roots.collect { new File(adapterRoot, it) })
	}
}

base {
	archivesName = "arctic-mod-${mc}"
}

// The shared Arctic Client core is compiled into this adapter.
sourceSets {
	main {
		java.srcDirs = [preprocessedJava, '../../core/src/main/java']
		resources.srcDirs = [new File(adapterRoot, 'src/main/resources'), '../../core/src/main/resources']
	}
}

tasks.named('compileJava') {
	dependsOn 'preprocessJava'
}

dependencies {
	minecraft "com.mojang:minecraft:${mc}"
	// 26.1 and later ship unobfuscated; older versions use Mojang's names.
	if (project.hasProperty('mappings_file')) {
		// 1.13.2: Mojang never published names for it; this file (mod/tools/mapgen) carries 1.14.4's across.
		// Loom reads a mappings jar: the Tiny file goes into one (made here, before Loom needs it).
		def tinyFile = file(project.mappings_file)
		// Named by the mapping's content: a changed mapping is never served from an older jar or Loom cache.
		def tinyHash = java.security.MessageDigest.getInstance('MD5').digest(tinyFile.bytes).encodeHex().toString().take(12)
		def mappingsJar = layout.buildDirectory.file("mappings/mappings-${mc}-${tinyHash}.jar").get().asFile
		if (!mappingsJar.exists()) {
			mappingsJar.parentFile.mkdirs()
			mappingsJar.withOutputStream { out ->
				def zip = new java.util.zip.ZipOutputStream(out)
				zip.putNextEntry(new java.util.zip.ZipEntry('mappings/mappings.tiny'))
				zip.write(tinyFile.bytes)
				zip.closeEntry()
				zip.close()
			}
		}
		// File dependencies all get the same "null.unspecified" Loom identity, even when the
		// filename changes. Put the content hash in the dependency coordinates as well.
		repositories.exclusiveContent {
			forRepository {
				repositories.flatDir { dirs mappingsJar.parentFile }
			}
			filter { includeGroup 'com.arcticlauncher.mappings' }
		}
		mappings "com.arcticlauncher.mappings:mappings-${mc}-${tinyHash}:1.0"
	} else if (!atLeast('26.1')) {
		mappings loom.officialMojangMappings()
	}
	// The class-loading agent (see ArcticAgent) edits Fabric Loader with ASM, which the game ships.
	compileOnly 'org.ow2.asm:asm:9.9'
	compileOnly 'org.ow2.asm:asm-tree:9.9'
	if (atLeast('26.1')) {
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	} else {
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	}
}

// Compile against the Mixin that Fabric Loader 0.16-0.18 ship. In Fabric's Mixin 0.17.3+ a
// @Redirect's `at` is an array, so a jar compiled against it stores a list there, and the
// MixinExtras of older loaders can't read that: "ArrayList cannot be cast to AnnotationNode" at
// start (COBBLEVERSE, Loader 0.18.4). The single form reads fine on every loader.
configurations.named('compileClasspath') {
	resolutionStrategy.force 'net.fabricmc:sponge-mixin:0.15.4+mixin.0.8.7'
}

def javaVersion = arcticJavaVersion

// The Minecraft versions this jar loads on (-Pcovers=26.1,26.1.1,26.1.2,
// from targets.json); just the built version by default.
def covers = (project.findProperty('covers') ?: mc).tokenize(',')
def minecraftRange = '[' + covers.collect { '"' + it.trim() + '"' }.join(', ') + ']'

// The oldest Fabric Loader that can actually load this jar: the compile-time
// loader_version for 1.21.6+ (already required), a much older one below that
// so players on old Minecraft aren't forced onto a needlessly new loader.
def loaderMin = atLeast('1.21.6') ? project.loader_version : '0.16.9'

processResources {
	def props = arcticProps + [
			minecraft_range: minecraftRange,
			loader_min: loaderMin,
	]
	inputs.properties props
	filesMatching(['fabric.mod.json', 'arctic.mixins.json']) {
		expand props
	}
	arcticResources(delegate)
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersion
	it.options.encoding = 'UTF-8'
	it.options.compilerArgs += ['-Xmaxerrs', '1000']
}

java {
	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)
}

// The jar is also a Java agent (started with -javaagent before the game, see ArcticAgent).
tasks.named('jar') {
	manifest {
		attributes('Premain-Class': 'com.arcticlauncher.mod.startup.ArcticAgent')
	}
}

// The startup diagnostics guard is exercised against generated Knot fixtures and the real Loader;
// the replay protocol tests use the same version preprocessing as the adapter.
if (atLeast('1.18')) {
	def preprocessedTests = layout.buildDirectory.dir("preprocessed/${mc}/test")
	tasks.register('preprocessTestJava') {
		inputs.dir new File(adapterRoot, 'src/test/java')
		inputs.property 'minecraft_version', mc
		outputs.dir preprocessedTests
		outputs.upToDateWhen { false }
		doLast {
			def outDir = preprocessedTests.get().asFile
			project.delete(outDir)
			def root = new File(adapterRoot, 'src/test/java')
			if (root.exists()) root.eachFileRecurse(groovy.io.FileType.FILES) { f ->
				def rel = root.toPath().relativize(f.toPath()).toString()
				def target = new File(outDir, rel)
				target.parentFile.mkdirs()
				target.text = arcticPreprocessText(f.getText('UTF-8'), rel)
			}
		}
	}
	sourceSets.test.java.srcDirs = [preprocessedTests]
	tasks.named('compileTestJava') { dependsOn 'preprocessTestJava' }
	dependencies {
		testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
		testImplementation 'org.ow2.asm:asm:9.9'
		testImplementation 'org.ow2.asm:asm-tree:9.9'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	}
	tasks.named('test') {
		useJUnitPlatform()
		maxHeapSize = '1G'
		maxParallelForks = 1
		workingDir = layout.buildDirectory.dir('test-runtime').get().asFile
		doFirst { workingDir.mkdirs() }
	}
} else {
	sourceSets.test.java.setSrcDirs([])
}
