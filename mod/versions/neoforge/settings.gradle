pluginManagement {
	repositories {
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases'
		}
		gradlePluginPortal()
	}
}

plugins {
	// ModDevGradle runs NeoForge's tools on the Java of each Minecraft version (17 for 1.20.x).
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Arctic Client for NeoForge. Build from mod/ (mod/targets.json has the NeoForge version for each):
// ./gradlew -p versions/neoforge build -Pminecraft_version=1.21.1 -Pneoforge_version=21.1.267
rootProject.name = 'arctic-neoforge'
