<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Arctic moderation</title>
<style>
  :root {
    --bg: #f3f6fb; --panel: #ffffff; --panel-2: #f7f9fc; --line: #dde4ef; --line-strong: #c7d2e3;
    --text: #0f1b30; --muted: #5b6b86; --faint: #8b99b1;
    --accent: #0277c2; --accent-text: #ffffff; --accent-soft: #e3f1fb;
    --good: #0b8a5f; --good-soft: #e2f5ed; --bad: #cf2e2e; --bad-soft: #fbe7e7; --warn: #a15c00; --warn-soft: #fdf1dc;
    --shadow: 0 1px 2px rgb(15 27 48 / 6%), 0 4px 16px rgb(15 27 48 / 5%);
    --radius: 12px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a111e; --panel: #111b2d; --panel-2: #0e1727; --line: #1f2d45; --line-strong: #2c3d5c;
      --text: #e6eefc; --muted: #93a3bf; --faint: #66779a;
      --accent: #4cc2fb; --accent-text: #04121f; --accent-soft: #10304a;
      --good: #3ed69f; --good-soft: #0f3326; --bad: #ff7a7a; --bad-soft: #3a1618; --warn: #f5c04f; --warn-soft: #3a2b0c;
      --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 4px 16px rgb(0 0 0 / 25%);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a111e; --panel: #111b2d; --panel-2: #0e1727; --line: #1f2d45; --line-strong: #2c3d5c;
    --text: #e6eefc; --muted: #93a3bf; --faint: #66779a;
    --accent: #4cc2fb; --accent-text: #04121f; --accent-soft: #10304a;
    --good: #3ed69f; --good-soft: #0f3326; --bad: #ff7a7a; --bad-soft: #3a1618; --warn: #f5c04f; --warn-soft: #3a2b0c;
    --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 4px 16px rgb(0 0 0 / 25%);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  code, pre, .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
  a { color: var(--accent); }

  header.top { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
  .top-inner { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
  .brand { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; margin-right: auto; white-space: nowrap; }
  .brand-mark { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, #4cc2fb, #0277c2); }
  .who { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tabs { max-width: 1180px; margin: 0 auto; padding: 0 12px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { appearance: none; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600;
         padding: 10px 12px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .tab:hover { color: var(--text); }
  .tab.on { color: var(--accent); border-bottom-color: var(--accent); }
  .count { min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--accent-text);
           font-size: 11px; line-height: 18px; text-align: center; font-weight: 700; }
  .count:empty { display: none; }

  main { max-width: 1180px; margin: 0 auto; padding: 16px; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
  .toolbar .grow { flex: 1; }
  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
  .seg button { border: 0; background: none; padding: 5px 11px; border-radius: 7px; color: var(--muted); font-weight: 600; }
  .seg button:hover { color: var(--text); background: var(--panel-2); }
  .seg button.on { background: var(--accent-soft); color: var(--accent); }

  button, .btn { font: inherit; font-weight: 600; color: var(--text); background: var(--panel); border: 1px solid var(--line-strong);
                 border-radius: 8px; padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
                 justify-content: center; white-space: nowrap; transition: background .12s, border-color .12s, opacity .12s; }
  button:hover { border-color: var(--accent); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .item:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .55; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.good { background: var(--good-soft); border-color: transparent; color: var(--good); }
  button.good:hover { border-color: var(--good); }
  button.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
  button.bad:hover { border-color: var(--bad); }
  button.ghost { background: none; border-color: transparent; color: var(--muted); }
  button.ghost:hover { color: var(--text); background: var(--panel-2); }
  button.small { padding: 3px 8px; font-size: 12px; }
  button.busy { position: relative; color: transparent !important; }
  button.busy::after { content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%;
                       border: 2px solid var(--muted); border-right-color: transparent; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  input, select, textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line-strong);
                            border-radius: 8px; padding: 6px 10px; min-width: 0; }
  input.search { width: 240px; max-width: 100%; }
  input.filter { width: 130px; }
  textarea { width: 100%; resize: vertical; }

  .notice { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 10px; margin-bottom: 14px;
            background: var(--warn-soft); color: var(--warn); font-weight: 600; font-size: 13px; }

  .list { display: grid; gap: 8px; }
  .item { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px;
          box-shadow: var(--shadow); display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; align-items: start;
          transition: opacity .2s, transform .2s; }
  .item.click { cursor: pointer; }
  .item.click:hover { border-color: var(--line-strong); }
  .item.leaving { opacity: 0; transform: translateX(12px); }
  .item h3 { margin: 0; font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; }
  .item .body { min-width: 0; display: grid; gap: 4px; }
  .item .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 12px; overflow-wrap: anywhere; }
  .meta > span { min-width: 0; }
  .text { overflow-wrap: anywhere; white-space: pre-wrap; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
          background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
  .chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
  .chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
  .chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .chip.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .time { color: var(--faint); font-size: 12px; white-space: nowrap; }
  .addr { display: inline-flex; align-items: center; gap: 4px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; box-shadow: var(--shadow);
          display: grid; gap: 8px; align-content: start; transition: opacity .2s, transform .2s; }
  .card.leaving { opacity: 0; transform: scale(.97); }
  .card img { width: 100%; aspect-ratio: 1 / 1; object-fit: contain; image-rendering: pixelated; border-radius: 8px;
              background: repeating-conic-gradient(#8882 0 25%, transparent 0 50%) 0 0 / 16px 16px; }
  .card canvas.skin { width: 100%; aspect-ratio: 1 / 1; image-rendering: pixelated; border-radius: 8px; cursor: pointer;
                      background: repeating-conic-gradient(#8882 0 25%, transparent 0 50%) 0 0 / 16px 16px; }
  .card h3 { margin: 0; font-size: 14px; overflow-wrap: anywhere; }
  .card .actions { justify-content: stretch; }
  .card .actions button { flex: 1; }

  .detail { display: grid; gap: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
  .panel h2 { margin: 0 0 6px; font-size: 17px; overflow-wrap: anywhere; }
  .panel h4 { margin: 0 0 6px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 13px; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; overflow-wrap: anywhere; }
  .log-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .log-head h4 { margin: 0; margin-right: auto; }
  pre.log { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; line-height: 1.45; max-height: 70vh; overflow: auto;
            background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  tr:last-child td { border-bottom: 0; }
  .table-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: auto; }

  .empty, .failed { text-align: center; padding: 56px 16px; color: var(--muted); }
  .empty strong, .failed strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }
  .failed strong { color: var(--bad); }
  .failed button { margin-top: 12px; }
  .skeleton { height: 64px; border-radius: var(--radius); background: linear-gradient(90deg, var(--panel) 0%, var(--panel-2) 50%, var(--panel) 100%);
              background-size: 200% 100%; animation: shimmer 1.2s infinite; border: 1px solid var(--line); }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .loading-note { color: var(--muted); font-size: 13px; margin-bottom: 8px; }

  .login { max-width: 400px; margin: 12vh auto 0; padding: 0 16px; }
  .login .panel { padding: 24px; display: grid; gap: 12px; }
  .login h1 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 10px; }
  .login input[type=password] { width: 100%; padding: 9px 12px; }
  .login label.check { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
  .login .error { color: var(--bad); min-height: 1.4em; font-size: 13px; }

  dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--panel); color: var(--text);
           width: min(460px, calc(100vw - 32px)); box-shadow: 0 20px 60px rgb(0 0 0 / 30%); }
  dialog::backdrop { background: rgb(5 10 20 / 55%); }
  dialog form { padding: 18px; display: grid; gap: 12px; margin: 0; }
  dialog h3 { margin: 0; font-size: 16px; }
  dialog .field { display: grid; gap: 4px; }
  dialog .field label { font-weight: 600; font-size: 13px; }
  dialog .field input, dialog .field select { width: 100%; }
  dialog .hint { color: var(--muted); font-size: 12px; }
  dialog .error { color: var(--bad); font-size: 13px; min-height: 0; }
  dialog .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

  #toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 20; max-width: min(380px, calc(100vw - 32px)); }
  .toast { padding: 10px 14px; border-radius: 10px; background: var(--text); color: var(--bg); font-weight: 600; font-size: 13px;
           box-shadow: var(--shadow); animation: rise .18s ease-out; overflow-wrap: anywhere; }
  .toast.bad { background: var(--bad); color: #fff; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }

  @media (max-width: 720px) {
    .item { grid-template-columns: 1fr; }
    .item .side { align-items: stretch; }
    .actions { justify-content: flex-start; }
    .who { display: none; }
    input.search { width: 100%; }
    .toolbar .grow { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<script>
"use strict";
// Everything from the server goes on the page as text (textContent), never as HTML.

const KEY = "arctic-admin-key";
const THEME = "arctic-admin-theme";
const REQUEST_TIMEOUT_MS = 25000;
const COUNTS_EVERY_MS = 60000;
const TOAST_MS = 3500;

const app = document.getElementById("app");
let key = readKey();
let me = null;
let renderSeq = 0;
/** Per tab: what the search box holds. */
const searches = {};
const crashFilters = { os: "", launcher: "", game: "" };
let suggestionKind = "all";

// ---- small helpers -------------------------------------------------------

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "dataset") Object.assign(e.dataset, v);
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "title" || k === "type" || k === "role" || k.startsWith("aria-")) e.setAttribute(k, v);
    else e[k] = v;
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) e.append(kid);
  return e;
}

function safeStorage(kind) {
  try { return kind === "local" ? window.localStorage : window.sessionStorage; } catch (_) { return null; }
}
function readKey() {
  for (const kind of ["session", "local"]) {
    try { const v = safeStorage(kind)?.getItem(KEY); if (v) return v; } catch (_) { /* blocked storage */ }
  }
  return "";
}
function saveKey(value, remember) {
  for (const kind of ["session", "local"]) { try { safeStorage(kind)?.removeItem(KEY); } catch (_) { /* blocked */ } }
  if (!value) return;
  try { safeStorage(remember ? "local" : "session")?.setItem(KEY, value); } catch (_) { /* kept in memory only */ }
}

function fmt(n) { return Number(n || 0).toLocaleString(); }
function plural(n, one, many) { return fmt(n) + " " + (n === 1 ? one : many); }
function fullTime(t) { return t ? new Date(t * 1000).toLocaleString() : ""; }
function ago(t) {
  if (!t) return "never";
  const s = Math.max(0, Date.now() / 1000 - t);
  if (s < 45) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  if (s < 86400 * 14) return Math.round(s / 86400) + " d ago";
  return new Date(t * 1000).toLocaleDateString();
}
function timeEl(t) { return el("span", { class: "time", title: fullTime(t) }, ago(t)); }
function chip(text, tone, withDot) { return el("span", { class: "chip" + (tone ? " " + tone : "") }, withDot ? el("span", { class: "dot" }) : null, text); }
function canChange() { return !!me && me.role !== "reader"; }

async function copy(text, what) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (_) {
    const area = el("textarea", { value: text, style: "position:fixed;opacity:0" });
    document.body.append(area); area.select();
    try { document.execCommand("copy"); } finally { area.remove(); }
  }
  toast((what || "Text") + " copied");
}
function copyButton(text, what) {
  return el("button", { class: "ghost small", title: "Copy " + (what || "").toLowerCase(), onclick: (e) => { e.stopPropagation(); copy(text, what); } }, "Copy");
}

function toast(text, tone) {
  const t = el("div", { class: "toast" + (tone ? " " + tone : "") }, text);
  document.getElementById("toasts").append(t);
  setTimeout(() => t.remove(), tone === "bad" ? TOAST_MS * 2 : TOAST_MS);
}

// ---- talking to the server ----------------------------------------------

class ApiError extends Error {
  constructor(message, status) { super(message); this.status = status; }
}

async function api(path, options) {
  const { method = "GET", body } = options || {};
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
  let res;
  try {
    res = await fetch(path, {
      method,
      headers: body === undefined ? { "X-Admin-Key": key } : { "X-Admin-Key": key, "Content-Type": "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body),
      cache: "no-store",
      credentials: "omit",
      signal: controller.signal,
    });
  } catch (e) {
    throw new ApiError(e.name === "AbortError" ? "The server took too long to answer." : "Can't reach the server. Check your connection.", 0);
  } finally {
    clearTimeout(timer);
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new ApiError(data.error || "Request failed (" + res.status + ")", res.status);
  return data;
}

/** A refused call: signed out if the key stopped working, otherwise just said. */
async function failed(e) {
  if (e instanceof ApiError && e.status === 403) {
    try { me = await api("/v1/admin/me"); }
    catch (inner) {
      if (inner instanceof ApiError && inner.status === 403) { signOut("Your key no longer works. Sign in again."); return; }
    }
    toast(canChange() ? e.message : "Read-only key: changes are off.", "bad");
    return;
  }
  toast(e.message || String(e), "bad");
}

/** Run `work` for a button: busy while it runs, never twice at once. */
async function act(button, work, done) {
  if (button.disabled) return false;
  button.disabled = true; button.classList.add("busy");
  try {
    await work();
    if (done) toast(done);
    refreshCounts();
    return true;
  } catch (e) {
    await failed(e);
    return false;
  } finally {
    button.disabled = false; button.classList.remove("busy");
  }
}

/** Take a handled item off the list, and show the empty state if it was the last. */
function leave(node, emptyText) {
  node.classList.add("leaving");
  setTimeout(() => {
    const parent = node.parentElement;
    node.remove();
    if (parent && !parent.children.length) {
      // The count above the list was about what just left.
      if (parent.previousElementSibling?.classList.contains("loading-note")) parent.previousElementSibling.remove();
      parent.replaceWith(empty(emptyText || "All done here."));
    }
  }, 200);
}

// ---- dialogs -------------------------------------------------------------

/**
 * A small form over the page. `fields`: [{ name, label, value, placeholder, hint, options: [[value, label]] }].
 * Resolves to the values, or null if closed. `check(values)` may return an error to show instead of closing.
 */
function ask({ title, text, fields = [], confirm = "OK", tone = "primary", check }) {
  return new Promise((resolve) => {
    const inputs = {};
    const error = el("div", { class: "error" });
    const rows = fields.map((f) => {
      const id = "f-" + f.name;
      const input = f.options
        ? el("select", { id }, ...f.options.map(([v, label]) => el("option", { value: v, selected: v === f.value }, label)))
        : el("input", { id, type: "text", value: f.value || "", placeholder: f.placeholder || "", autocomplete: "off" });
      inputs[f.name] = input;
      return el("div", { class: "field" }, el("label", { htmlFor: id }, f.label), input, f.hint ? el("div", { class: "hint" }, f.hint) : null);
    });
    const dialog = el("dialog", {});
    const close = (value) => { dialog.close(); dialog.remove(); resolve(value); };
    const form = el("form", { method: "dialog", onsubmit: (e) => {
      e.preventDefault();
      const values = Object.fromEntries(Object.entries(inputs).map(([k, i]) => [k, i.value.trim()]));
      const problem = check ? check(values) : null;
      if (problem) { error.textContent = problem; return; }
      close(values);
    } },
      el("h3", {}, title),
      text ? el("div", { class: "text", style: "color:var(--muted)" }, text) : null,
      ...rows, error,
      el("div", { class: "buttons" },
        el("button", { type: "button", class: "ghost", onclick: () => close(null) }, "Cancel"),
        el("button", { type: "submit", class: tone }, confirm)));
    dialog.append(form);
    dialog.addEventListener("cancel", (e) => { e.preventDefault(); close(null); });
    document.body.append(dialog);
    dialog.showModal();
    (Object.values(inputs)[0] || form.querySelector("button[type=submit]")).focus();
  });
}

async function sure(title, text, confirm) {
  return (await ask({ title, text, confirm: confirm || "Delete", tone: "bad" })) !== null;
}

// ---- routing -------------------------------------------------------------

const TABS = [
  { id: "gallery", label: "Gallery", subs: [["pending", "Waiting"], ["reported", "Reported"], ["hidden", "Hidden"], ["approved", "Live"], ["rejected", "Rejected"]] },
  { id: "servers", label: "Servers", subs: [["pending", "Waiting"], ["unverified", "Unverified"], ["listed", "Listed"], ["curated", "Curated"], ["rejected", "Rejected"]] },
  { id: "suggestions", label: "Suggestions", subs: [["open", "Open"], ["done", "Done"], ["all", "All"]] },
  { id: "crashes", label: "Crashes", subs: [["open", "Open"], ["resolved", "Resolved"], ["all", "All"]] },
  { id: "overview", label: "Overview", subs: [["now", "Now"]] },
  { id: "history", label: "History", subs: [["decisions", "Decisions"], ["reads", "Read-only keys"]] },
];

function route() {
  const [tabId, sub, id] = location.hash.replace(/^#\/?/, "").split("/").map((p) => { try { return decodeURIComponent(p); } catch (_) { return ""; } });
  const tab = TABS.find((t) => t.id === tabId) || TABS[0];
  const known = tab.subs.some(([s]) => s === sub);
  return { tab, sub: known ? sub : tab.subs[0][0], id: id || null };
}

function go(tab, sub, id) {
  const hash = "#" + [tab, sub, id].filter((p) => p !== undefined && p !== null).map(encodeURIComponent).join("/");
  if (location.hash === hash) render(); else location.hash = hash;
}

window.addEventListener("hashchange", () => render());

// ---- the page ------------------------------------------------------------

function signOut(message) {
  key = ""; me = null; saveKey("");
  login(message);
}

function login(message) {
  const input = el("input", { type: "password", placeholder: "Moderator or read-only key", autocomplete: "current-password", "aria-label": "Key" });
  const remember = el("input", { type: "checkbox" });
  const error = el("div", { class: "error" }, message || "");
  const button = el("button", { class: "primary", type: "submit" }, "Sign in");
  const form = el("form", { class: "panel", onsubmit: async (e) => {
    e.preventDefault();
    const given = input.value.trim();
    if (!given) { error.textContent = "Enter your key."; return; }
    button.disabled = true; button.classList.add("busy"); error.textContent = "";
    key = given;
    try {
      me = await api("/v1/admin/me");
      saveKey(key, remember.checked);
      render();
    } catch (err) {
      key = "";
      error.textContent = err.status === 403 ? "That key isn't valid." : err.message;
      button.disabled = false; button.classList.remove("busy");
      input.select();
    }
  } },
    el("h1", {}, el("span", { class: "brand-mark" }), "Arctic moderation"),
    el("div", { style: "color:var(--muted)" }, "Sign in with your key. It stays in this tab until you close it, unless you choose to stay signed in."),
    input,
    el("label", { class: "check" }, remember, "Stay signed in on this device"),
    button, error);
  app.replaceChildren(el("div", { class: "login" }, form));
  input.focus();
}

function themeButton() {
  const order = ["auto", "light", "dark"];
  const labels = { auto: "Theme: auto", light: "Theme: light", dark: "Theme: dark" };
  let current = "auto";
  try { current = safeStorage("local")?.getItem(THEME) || "auto"; } catch (_) { /* default */ }
  const button = el("button", { class: "ghost small", title: "Switch theme" }, labels[current] || labels.auto);
  button.addEventListener("click", () => {
    current = order[(order.indexOf(current) + 1) % order.length];
    applyTheme(current);
    try { safeStorage("local")?.setItem(THEME, current); } catch (_) { /* not kept */ }
    button.textContent = labels[current];
  });
  return button;
}
function applyTheme(theme) {
  if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
  else delete document.documentElement.dataset.theme;
}

function shell(r) {
  const counts = (me && me.counts) || {};
  const tabs = el("nav", { class: "tabs", "aria-label": "Sections" }, ...TABS.map((t) =>
    el("button", { class: "tab" + (t.id === r.tab.id ? " on" : ""), onclick: () => go(t.id, searches[t.id + ":sub"] || t.subs[0][0]) },
      t.label, el("span", { class: "count", dataset: { count: t.id } }, counts[t.id] ? String(counts[t.id]) : ""))));
  const header = el("header", { class: "top" },
    el("div", { class: "top-inner" },
      el("div", { class: "brand" }, el("span", { class: "brand-mark" }), "Arctic moderation"),
      el("span", { class: "who" }, me.name + (canChange() ? "" : " · read-only")),
      themeButton(),
      el("button", { class: "ghost small", title: "Reload this page's data (R)", onclick: () => { refreshCounts(); render(); } }, "Refresh"),
      el("button", { class: "small", onclick: () => signOut() }, "Sign out")),
    tabs);
  const content = el("div", {});
  const main = el("main", {},
    canChange() ? null : el("div", { class: "notice" }, "Read-only key: you see everything, and nothing can be changed from here."),
    content);
  app.replaceChildren(header, main);
  return { main, content };
}

function toolbar(r, extra) {
  const seg = el("div", { class: "seg", role: "tablist" }, ...r.tab.subs.map(([id, label]) =>
    el("button", { class: id === r.sub ? "on" : "", role: "tab", onclick: () => { searches[r.tab.id + ":sub"] = id; go(r.tab.id, id); } }, label)));
  const search = el("input", { class: "search", type: "search", placeholder: "Search this list  ( / )", value: searches[r.tab.id] || "", "aria-label": "Search" });
  search.addEventListener("input", () => { searches[r.tab.id] = search.value; applySearch(); });
  return el("div", { class: "toolbar" }, seg, ...(extra || []), el("span", { class: "grow" }), search);
}

function applySearch() {
  const r = route();
  const words = (searches[r.tab.id] || "").toLowerCase().split(/\s+/).filter(Boolean);
  for (const node of document.querySelectorAll("[data-search]")) {
    const hay = node.dataset.search;
    node.hidden = !words.every((w) => hay.includes(w));
  }
}
function searchable(node, ...parts) {
  node.dataset.search = parts.flat().filter(Boolean).join(" ").toLowerCase();
  return node;
}

function empty(text) { return el("div", { class: "empty" }, el("strong", {}, "Nothing here"), text || ""); }
function skeleton(note) {
  return el("div", {}, note ? el("div", { class: "loading-note" }, note) : null,
    el("div", { class: "list" }, ...[0, 1, 2].map(() => el("div", { class: "skeleton" }))));
}

async function render() {
  const seq = ++renderSeq;
  if (!key) return login();
  if (!me) {
    try { me = await api("/v1/admin/me"); }
    catch (e) { if (seq === renderSeq) login(e.status === 403 ? "That key isn't valid any more." : e.message); return; }
  }
  if (seq !== renderSeq) return;
  const r = route();
  const { content } = shell(r);
  const view = VIEWS[r.tab.id];
  content.replaceChildren(skeleton(r.tab.id === "servers" && !r.id ? "Asking each server how it is…" : ""));
  try {
    const node = await view(r);
    if (seq !== renderSeq) return;
    content.replaceChildren(node);
    applySearch();
  } catch (e) {
    if (seq !== renderSeq) return;
    if (e instanceof ApiError && e.status === 403) { await failed(e); if (!me) return; }
    content.replaceChildren(el("div", { class: "failed" }, el("strong", {}, "Couldn't load this"), e.message,
      el("div", {}, el("button", { onclick: () => render() }, "Try again"))));
  }
}

async function refreshCounts() {
  if (!key || !me) return;
  try {
    const fresh = await api("/v1/admin/me");
    me = fresh;
    for (const badge of document.querySelectorAll("[data-count]")) {
      const n = (fresh.counts || {})[badge.dataset.count];
      badge.textContent = n ? String(n) : "";
    }
  } catch (_) { /* the next action says what went wrong */ }
}

const GALLERY_ACTIONS = {
  pending: [["approve", "Approve", "good"], ["reject", "Reject", "bad"]],
  reported: [["restore", "Keep", "good"], ["remove", "Remove", "bad"]],
  hidden: [["restore", "Restore", "good"], ["remove", "Remove", "bad"]],
  approved: [["remove", "Remove", "bad"]],
  rejected: [["approve", "Approve", "good"], ["remove", "Remove", "bad"]],
};
const GALLERY_DONE = { approve: "Approved", reject: "Rejected", restore: "Restored", remove: "Removed" };

async function renameGalleryItem(it, card, title, button) {
  const values = await ask({
    title: "Rename “" + it.name + "”",
    text: "This is the name players see in the gallery.",
    fields: [{ name: "name", label: "Name", value: it.name, hint: "1 to 32 characters. A longer name is cut off." }],
    confirm: "Save",
    check(values) {
      if (!values.name.replace(/[\u0000-\u001F\u007F]/g, "").trim()) return "Give the skin a name.";
      return null;
    },
  });
  if (!values || values.name === it.name) return;
  let saved = null;
  const ok = await act(button, async () => {
    saved = await api("/v1/admin/gallery/" + encodeURIComponent(it.id) + "/name", { method: "POST", body: { name: values.name } });
  });
  if (!ok || !saved || !saved.name) return;
  it.name = saved.name;
  title.textContent = saved.name;
  const raw = card.querySelector("img");
  if (raw) raw.alt = "Skin " + saved.name;

  toast("Renamed: " + saved.name);
}

// The real thing: the skin on a 3D character you can turn by dragging (scroll to zoom). The viewer library
// (skinview3d) loads the first time it is asked for, so the page stays light.
const SKINVIEW3D = "/admin/skinview3d.js";
let skinviewLoading = null;
function loadSkinView() {
  if (window.skinview3d) return Promise.resolve();
  if (!skinviewLoading) {
    skinviewLoading = new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = SKINVIEW3D;
      script.onload = resolve;
      script.onerror = () => { skinviewLoading = null; reject(new Error("The 3D viewer couldn't be loaded.")); };
      document.head.append(script);
    });
  }
  return skinviewLoading;
}

async function skin3d(src, slim, name) {
  const dialog = el("dialog", {});
  const note = el("div", { class: "hint", style: "text-align:center" }, "Drag to turn, scroll to zoom");
  const canvas = el("canvas", { style: "display:block;width:320px;height:420px;border-radius:10px" });
  let viewer = null;
  const close = () => { if (viewer) viewer.dispose(); dialog.close(); dialog.remove(); };
  dialog.append(el("form", { method: "dialog", onsubmit: (e) => { e.preventDefault(); close(); } },
    el("h3", {}, name), canvas, note,
    el("div", { class: "buttons" }, el("button", { type: "submit", class: "ghost" }, "Close"))));
  dialog.addEventListener("cancel", (e) => { e.preventDefault(); close(); });
  dialog.addEventListener("click", (e) => { if (e.target === dialog) close(); });
  document.body.append(dialog);
  dialog.showModal();
  try {
    await loadSkinView();
    viewer = new skinview3d.SkinViewer({ canvas, width: 320, height: 420, skin: src, model: slim ? "slim" : "default" });
    viewer.autoRotate = true;
    viewer.autoRotateSpeed = 0.6;
    viewer.zoom = 0.85;
  } catch (e) {
    note.textContent = e.message || "The 3D viewer couldn't be shown.";
    note.style.color = "var(--bad)";
  }
}

// A skin as a character from the front and the back (body, arms, legs, head, with the outer layers), so a
// reviewer sees what people will see. Clicking it shows the raw texture sheet, and back.
function skinPreview(src, slim, name) {
  const SCALE = 5, W = 16, H = 32, GAP = 4;
  const canvas = el("canvas", { class: "skin", title: "Click for the raw texture", width: (W * 2 + GAP) * SCALE, height: W * 2 * SCALE });
  const raw = el("img", { src, alt: "Skin " + name, loading: "lazy", style: "display:none" });
  const img = new Image();
  img.onload = () => { try {
    const old = img.height === 32; // 64x32 skins have one arm and one leg, used for both sides
    const aw = slim ? 3 : 4;
    const view = document.createElement("canvas");
    view.width = (W * 2 + GAP); view.height = H;
    const g = view.getContext("2d");
    g.imageSmoothingEnabled = false;
    // part(source x, y, w, h, dest x, y, mirror)
    const part = (sx, sy, w, h, dx, dy, mirror) => {
      if (mirror) {
        g.save(); g.translate(dx + w, dy); g.scale(-1, 1); g.drawImage(img, sx, sy, w, h, 0, 0, w, h); g.restore();
      } else {
        g.drawImage(img, sx, sy, w, h, dx, dy, w, h);
      }
    };
    // One character seen from the front or the back, its top-left at ox. Each part is [x, y] of its face in the
    // sheet (an arm's back face is one column further left on slim skins), drawn base layer first, outer layer after.
    const body = (ox, f) => {
      const slimBack = slim ? 1 : 0;
      const parts = {
        rArm: [f ? [44, 20] : [52 - slimBack, 20], f ? [44, 36] : [52 - slimBack, 36], aw],
        lArm: [f ? [36, 52] : [44 - slimBack, 52], f ? [52, 52] : [60 - slimBack, 52], aw],
        rLeg: [f ? [4, 20] : [12, 20], f ? [4, 36] : [12, 36], 4],
        lLeg: [f ? [20, 52] : [28, 52], f ? [4, 52] : [12, 52], 4],
      };
      // Where each part stands: the right side of the character is on the viewer's left from the front.
      const at = {
        rArm: f ? ox + 4 - aw : ox + 12, lArm: f ? ox + 12 : ox + 4 - aw,
        rLeg: f ? ox + 4 : ox + 8, lLeg: f ? ox + 8 : ox + 4,
      };
      const y = { rArm: 8, lArm: 8, rLeg: 20, lLeg: 20 };
      for (const layer of [0, 1]) {
        for (const name of ["rLeg", "lLeg", "rArm", "lArm"]) {
          const [base, outer, w] = parts[name];
          const left = name[0] === "l";
          if (old && layer === 1) continue; // 64x32 skins have no outer layers below the head
          const src = old && left && layer === 0 ? parts[name === "lArm" ? "rArm" : "rLeg"][0] : layer ? outer : base;
          part(src[0], src[1], w, 12, at[name], y[name], old && left && layer === 0);
        }
        if (layer === 0) part(f ? 20 : 32, 20, 8, 12, ox + 4, 8, false);
        else if (!old) part(f ? 20 : 32, 36, 8, 12, ox + 4, 8, false);
        part(f ? (layer ? 40 : 8) : (layer ? 56 : 24), 8, 8, 8, ox + 4, 0, false);
      }
    };
    body(0, true);
    body(W + GAP, false);
    const c = canvas.getContext("2d");
    c.imageSmoothingEnabled = false;
    const sw = (W * 2 + GAP) * SCALE, sh = H * SCALE, top = (canvas.height - sh) / 2;
    c.drawImage(view, 0, 0, W * 2 + GAP, H, 0, top, sw, sh);
  } catch (e) { canvas.style.display = "none"; raw.style.display = ""; } };
  img.onerror = () => { canvas.style.display = "none"; raw.style.display = ""; };
  img.src = src;
  const toggle = () => {
    const showRaw = raw.style.display === "none";
    raw.style.display = showRaw ? "" : "none";
    canvas.style.display = showRaw ? "none" : "";
  };
  canvas.onclick = toggle;
  raw.onclick = toggle;
  const view3d = el("button", { type: "button", class: "ghost small", dataset: { skinName: name }, onclick: () => skin3d(src, slim, view3d.dataset.skinName) }, "3D view");
  return el("div", { style: "display:contents" }, canvas, raw, view3d);
}

async function gallery(r) {
  const data = await api("/v1/admin/gallery?queue=" + encodeURIComponent(r.sub));
  const items = data.items || [];
  const renamable = canChange() && (r.sub === "pending" || r.sub === "approved");
  const cards = items.map((it) => {
    const card = el("div", { class: "card" });
    const title = el("h3", {}, it.name);
    const buttons = canChange() ? (GALLERY_ACTIONS[r.sub] || []).map(([action, label, tone]) => {
      const b = el("button", { class: tone + " small", onclick: async () => {
        if (action === "remove" && !(await sure("Remove “" + it.name + "”?", "It leaves the gallery for good.", "Remove"))) return;
        if (await act(b, () => api("/v1/admin/gallery/" + encodeURIComponent(it.id), { method: "POST", body: { action } }), GALLERY_DONE[action] + ": " + it.name)) leave(card);
      } }, label);
      return b;
    }) : [];
    if (renamable) {
      const rename = el("button", { class: "ghost small" }, "Rename");
      const open = () => renameGalleryItem(it, card, title, rename);
      rename.onclick = open;
      title.title = "Rename";
      title.style.cursor = "text";
      title.onclick = open;
      buttons.push(rename);
    }
    card.append(...[
      skinPreview("/v1/textures/" + encodeURIComponent(it.texture) + ".png", it.model === "slim", it.name),
      title,
      el("div", { class: "meta" }, el("span", {}, "by " + it.author), el("span", {}, it.model), timeEl(it.created)),
      el("div", { class: "chips" },
        it.reports ? chip(plural(it.reports, "report", "reports"), "bad") : null,
        chip(plural(it.downloads, "use", "uses")),
        it.hidden ? chip("hidden", "warn") : null),
      buttons.length ? el("div", { class: "actions" }, ...buttons) : null].filter(Boolean));
    return searchable(card, it.name, it.author, it.model);
  });
  return el("div", {}, toolbar(r),
    cards.length ? el("div", { class: "grid" }, ...cards) : empty(r.sub === "pending" ? "No skins are waiting for review." : ""));
}

const SERVER_ACTIONS = {
  pending: [["edit", "Edit…", ""], ["approve", "Approve", "good"], ["reject", "Reject", "bad"]],
  unverified: [["edit", "Edit…", ""], ["approve", "Approve", "good"], ["reject", "Reject", "bad"], ["remove", "Remove", "bad"]],
  listed: [["edit", "Edit…", ""], ["partner", "Partner…", ""], ["reject", "Unlist", "bad"], ["remove", "Remove", "bad"]],
  curated: [["edit", "Edit…", ""], ["partner", "Partner…", ""]],
  rejected: [["edit", "Edit…", ""], ["approve", "Approve", "good"], ["remove", "Remove", "bad"]],
};
const SERVER_DONE = { approve: "Approved", reject: "Moved to rejected", remove: "Removed" };

function serverStatus(s) {
  if (s.online && !s.problem) return chip(fmt(s.players) + " / " + fmt(s.max_players) + " online", "good", true);
  return chip(s.problem ? "unreachable" : "offline", "bad", true);
}

async function partnerDialog(s) {
  const values = await ask({
    title: "Partner: " + s.name,
    text: "Partners are shown in their own place in the server list. Leave the name empty to make it an ordinary server again.",
    fields: [
      { name: "group", label: "Partner name", value: s.partner || "", placeholder: "for example Flash Hosting" },
      { name: "tier", label: "Where it shows", value: s.partner_tier || "hosted", options: [
        ["hosted", "Hosted: in the hosting partner's own tab"],
        ["exclusive", "Exclusive: our own server, on top of every list"]] },
    ],
    confirm: "Save",
  });
  if (!values) return null;
  return { action: "partner", group: values.group, tier: values.group ? values.tier : "hosted" };
}

async function editDialog(s) {
  const cracked = s.cracked === true ? "true" : s.cracked === false ? "false" : "clear";
  const values = await ask({
    title: "Edit: " + (s.name || s.address),
    text: "Clear the login check to let the pinger look again. Clear the owner so the real one can be set after they email.",
    fields: [
      { name: "name", label: "Name", value: s.name || "", hint: "1 to 40 characters" },
      { name: "description", label: "Description", value: s.description || "", hint: "200 characters at most" },
      { name: "tags", label: "Tags", value: (s.tags || []).join(", "), hint: "Comma-separated. Letters, numbers and dashes; up to 5." },
      { name: "cracked", label: "Login", value: cracked, options: [
        ["clear", "Unknown (pinger checks again)"],
        ["true", "Cracked"],
        ["false", "Premium"]] },
      { name: "owner", label: "Owner", value: s.owner || "", placeholder: "player id, empty to clear", hint: "The signed-in player's id." },
    ],
    confirm: "Save",
    check(values) {
      if (!values.name || [...values.name].length > 40) return "The name needs 1 to 40 characters.";
      if ([...values.description].length > 200) return "The description is too long (200 characters at most).";
      return null;
    },
  });
  if (!values) return null;
  return {
    action: "edit",
    name: values.name,
    description: values.description,
    tags: values.tags.split(",").map((t) => t.trim()).filter(Boolean),
    cracked: values.cracked,
    owner: values.owner,
  };
}

async function servers(r) {
  const data = await api("/v1/admin/servers?state=" + encodeURIComponent(r.sub));
  const list = data.servers || [];
  const rows = list.map((s) => {
    const item = el("div", { class: "item" });
    const buttons = canChange() ? (SERVER_ACTIONS[r.sub] || []).map(([action, label, tone]) => {
      const b = el("button", { class: (tone || "") + " small", onclick: async () => {
        let body = { action };
        if (action === "partner") { body = await partnerDialog(s); if (!body) return; }
        if (action === "edit") { body = await editDialog(s); if (!body) return; }
        if (action === "remove" && !(await sure("Remove " + s.name + "?", "It is deleted from every list. The owner can submit it again.", "Remove"))) return;
        const done = action === "partner" ? (body.group ? "Partner saved" : "Now an ordinary server")
          : action === "edit" ? "Saved: " + (body.name || s.name)
          : SERVER_DONE[action] + ": " + s.name;
        const ok = await act(b, () => api("/v1/admin/servers/" + encodeURIComponent(s.id), { method: "POST", body }), done);
        if (!ok) return;
        if (action === "partner" || action === "edit") render(); else leave(item);
      } }, label);
      return b;
    }) : [];
    const login = s.cracked === true ? chip("cracked") : s.cracked === false ? chip("premium") : null;
    item.append(
      el("div", { class: "body" },
        el("h3", {}, s.name || s.address),
        el("div", { class: "meta" },
          el("span", { class: "addr mono" }, s.address, copyButton(s.address, "Address")),
          s.version ? el("span", {}, s.version) : null),
        el("div", { class: "chips" }, serverStatus(s), login,
          s.partner ? chip("partner: " + s.partner + " (" + (s.partner_tier || "hosted") + ")", "accent") : null,
          ...(s.tags || []).map((t) => chip("#" + t))),
        s.problem ? el("div", { class: "meta", style: "color:var(--bad)" }, "Can't reach it: " + s.problem) : null,
        s.description && s.description !== s.address ? el("div", { class: "text clamp" }, s.description) : null,
        s.owner
          ? el("div", { class: "meta" }, "Submitted by ", el("span", { class: "mono" }, s.owner))
          : el("div", { class: "meta" }, "No owner")),
      el("div", { class: "side" }, buttons.length ? el("div", { class: "actions" }, ...buttons) : null));
    return searchable(item, s.name, s.address, s.description, s.tags, s.partner);
  });
  const online = list.filter((s) => s.online && !s.problem).length;
  const summary = list.length ? el("div", { class: "loading-note" }, plural(list.length, "server", "servers") + ", " + fmt(online) + " answering right now") : null;
  return el("div", {}, toolbar(r), summary,
    rows.length ? el("div", { class: "list" }, ...rows) : empty(r.sub === "pending" ? "No servers are waiting for review." : ""));
}

async function suggestions(r) {
  if (r.id) return suggestionDetail(r);
  const kind = el("select", { "aria-label": "Kind", onchange: () => { suggestionKind = kind.value; render(); } },
    ...[["all", "Bugs and ideas"], ["bug", "Bugs"], ["idea", "Ideas"]].map(([v, l]) => el("option", { value: v, selected: v === suggestionKind }, l)));
  const data = await api("/v1/admin/suggestions?limit=500&status=" + encodeURIComponent(r.sub) + "&kind=" + encodeURIComponent(suggestionKind));
  const rows = (data.entries || []).map((e) => searchable(
    el("div", { class: "item click", tabIndex: 0, onclick: () => go("suggestions", r.sub, e.id), onkeydown: (ev) => { if (ev.key === "Enter") go("suggestions", r.sub, e.id); } },
      el("div", { class: "body" },
        el("div", { class: "chips" }, chip(e.kind, e.kind === "bug" ? "bad" : "accent"), e.done ? chip("done", "good") : null, e.has_log ? chip("log attached") : null),
        el("div", { class: "text clamp" }, e.text),
        el("div", { class: "meta" }, e.contact ? el("span", {}, e.contact) : null, el("span", {}, e.os), el("span", {}, "launcher " + e.launcher))),
      el("div", { class: "side" }, timeEl(e.at))),
    e.text, e.contact, e.kind, e.os, e.launcher));
  return el("div", {}, toolbar(r, [kind]),
    rows.length ? el("div", { class: "list" }, ...rows) : empty(r.sub === "open" ? "No open suggestions." : ""));
}

async function suggestionDetail(r) {
  const d = await api("/v1/admin/suggestions/" + encodeURIComponent(r.id));
  const back = el("button", { class: "ghost", onclick: () => go("suggestions", r.sub) }, "← Back");
  const buttons = [back];
  if (canChange()) {
    const done = el("button", { class: d.done ? "" : "good", onclick: async () => {
      if (await act(done, () => api("/v1/admin/suggestions/" + d.id, { method: "POST", body: { done: !d.done } }), d.done ? "Marked as open" : "Marked as done")) go("suggestions", r.sub);
    } }, d.done ? "Mark as open" : "Mark as done");
    const del = el("button", { class: "bad", onclick: async () => {
      if (!(await sure("Delete this " + d.kind + "?", "It can't be brought back."))) return;
      if (await act(del, () => api("/v1/admin/suggestions/" + d.id, { method: "DELETE" }), "Deleted")) go("suggestions", r.sub);
    } }, "Delete");
    buttons.push(el("span", { class: "grow" }), done, del);
  }
  return el("div", { class: "detail" },
    el("div", { class: "toolbar" }, ...buttons),
    el("div", { class: "panel" },
      el("div", { class: "chips", style: "margin-bottom:8px" }, chip(d.kind, d.kind === "bug" ? "bad" : "accent"), d.done ? chip("done", "good") : chip("open")),
      el("dl", { class: "facts" },
        el("dt", {}, "Sent"), el("dd", {}, fullTime(d.at) + " (" + ago(d.at) + ")"),
        el("dt", {}, "Contact"), el("dd", {}, d.contact ? [d.contact, " ", copyButton(d.contact, "Contact")] : "none given"),
        el("dt", {}, "System"), el("dd", {}, d.os || "unknown"),
        el("dt", {}, "Launcher"), el("dd", {}, d.launcher || "unknown"))),
    logPanel("Message", d.text),
    d.log ? logPanel("Attached log", d.log) : null);
}

function logPanel(title, text) {
  return el("div", { class: "panel" },
    el("div", { class: "log-head" }, el("h4", {}, title), copyButton(text, title)),
    el("pre", { class: "log" }, text));
}

// ---- crashes -------------------------------------------------------------

function resolvedText(g) {
  return "Resolved " + ago(g.resolved_at) + (g.resolved_by ? " by " + g.resolved_by : "")
    + (g.fixed_in ? " · fixed in " + g.fixed_in : "")
    + (g.note && g.note !== "fixed in " + g.fixed_in ? " · " + g.note : "");
}

async function crashes(r) {
  if (r.id) return crashDetail(r);
  const filters = ["os", "launcher", "game"].map((name) => {
    const input = el("input", { class: "filter", type: "text", value: crashFilters[name], "aria-label": name,
      placeholder: { os: "System", launcher: "Launcher version", game: "Minecraft version" }[name] });
    input.addEventListener("change", () => { crashFilters[name] = input.value.trim(); render(); });
    return input;
  });
  const query = Object.entries(crashFilters).filter(([, v]) => v).map(([k, v]) => "&" + k + "=" + encodeURIComponent(v)).join("");
  const data = await api("/v1/admin/crashes?limit=500&status=" + encodeURIComponent(r.sub) + query);
  const rows = (data.groups || []).map((g) => {
    const headline = g.diagnosis || g.first_error || g.title || "Crash";
    const open = () => go("crashes", r.sub, g.id);
    return searchable(el("div", { class: "item click", tabIndex: 0, onclick: open, onkeydown: (ev) => { if (ev.key === "Enter") open(); } },
      el("div", { class: "body" },
        el("h3", {}, headline),
        g.diagnosis && g.first_error ? el("div", { class: "meta mono clamp" }, g.first_error) : null,
        el("div", { class: "meta" }, el("span", {}, "Minecraft " + g.game), g.loader ? el("span", {}, g.loader) : null,
          el("span", {}, (g.oses || []).join(", ")), el("span", {}, "launcher " + (g.launchers || []).join(", "))),
        g.status === "resolved" ? el("div", { class: "meta", style: "color:var(--good)" }, resolvedText(g)) : null),
      el("div", { class: "side" },
        chip(plural(g.count, "report", "reports"), g.count > 4 ? "bad" : g.count > 1 ? "warn" : ""),
        el("span", { class: "time", title: "Last report " + fullTime(g.last) }, "last " + ago(g.last)))),
      headline, g.first_error, g.game, g.loader, g.oses, g.launchers, g.note);
  });
  return el("div", {}, toolbar(r, filters),
    rows.length ? el("div", { class: "list" }, ...rows) : empty(r.sub === "open" ? "No open crashes. Nice." : ""));
}

async function crashDetail(r) {
  const d = await api("/v1/admin/crashes/" + encodeURIComponent(r.id));
  const buttons = [el("button", { class: "ghost", onclick: () => go("crashes", r.sub) }, "← Back")];
  if (canChange()) {
    buttons.push(el("span", { class: "grow" }));
    if (d.status === "resolved") {
      const reopen = el("button", { onclick: async () => {
        if (await act(reopen, () => api("/v1/admin/crashes/" + d.id, { method: "POST", body: { status: "open" } }), "Reopened")) render();
      } }, "Reopen");
      buttons.push(reopen);
    } else {
      const resolve = el("button", { class: "good", onclick: async () => {
        const values = await ask({
          title: "Mark this crash resolved",
          fields: [
            { name: "fixed_in", label: "Fixed in launcher version", placeholder: "for example 0.4.2",
              hint: "The crash coming back from this version or a newer one reopens it. Leave empty if unsure: then only a launcher newer than any that sent it reopens it." },
            { name: "note", label: "Note (optional)", placeholder: "what fixed it" },
          ],
          confirm: "Mark resolved", tone: "good",
          check: (v) => v.fixed_in && !/^\d+(\.\d+){1,3}$/.test(v.fixed_in) ? "The version looks like 0.4.2." : null,
        });
        if (!values) return;
        const body = { status: "resolved", fixed_in: values.fixed_in, note: values.note };
        if (await act(resolve, () => api("/v1/admin/crashes/" + d.id, { method: "POST", body }), "Marked resolved")) render();
      } }, "Mark resolved");
      buttons.push(resolve);
    }
    const del = el("button", { class: "bad", onclick: async () => {
      if (!(await sure("Delete this crash?", "Every report of it is deleted."))) return;
      if (await act(del, () => api("/v1/admin/crashes/" + d.id, { method: "DELETE" }), "Deleted")) go("crashes", r.sub);
    } }, "Delete");
    buttons.push(del);
  }
  const facts = [
    ["Status", d.status === "resolved" ? resolvedText(d) : "open"],
    ["Diagnosis", d.diagnosis], ["First error", d.first_error], ["Root cause", d.root_cause],
    ["Minecraft", [d.game, d.loader].filter(Boolean).join(" ")], ["System", d.os], ["Launcher", d.launcher],
    ["This report", fullTime(d.at) + " (" + ago(d.at) + ")"],
  ].filter(([, v]) => v);
  const reports = d.reports || [];
  return el("div", { class: "detail" },
    el("div", { class: "toolbar" }, ...buttons),
    el("div", { class: "panel" },
      el("h2", {}, d.diagnosis || d.first_error || d.title || "Crash"),
      el("dl", { class: "facts" }, ...facts.flatMap(([k, v]) => [el("dt", {}, k), el("dd", { class: k === "First error" || k === "Root cause" ? "mono" : "" }, v)]))),
    el("div", { class: "panel" },
      el("h4", {}, plural(reports.length, "report", "reports") + " of this crash"),
      el("div", { class: "table-wrap", style: "box-shadow:none" }, el("table", {},
        el("thead", {}, el("tr", {}, ...["When", "Launcher", "System", "Minecraft", "Contact"].map((h) => el("th", {}, h)))),
        el("tbody", {}, ...reports.map((x) => el("tr", {},
          el("td", { title: fullTime(x.at) }, ago(x.at)), el("td", {}, x.launcher), el("td", {}, x.os), el("td", {}, [x.game, x.loader].filter(Boolean).join(" ")), el("td", {}, x.contact || ""))))))),
    logPanel("Log", d.log || ""));
}

// ---- history -------------------------------------------------------------

async function history(r) {
  const reads = r.sub === "reads";
  const data = await api("/v1/admin/log" + (reads ? "?reads=1" : ""));
  const entries = data.entries || [];
  const rows = entries.map((e) => searchable(el("tr", {},
    el("td", { title: fullTime(e.at) }, ago(e.at)),
    el("td", {}, e.moderator),
    el("td", {}, chip(e.action, { approve: "good", restore: "good", resolve: "good", rename: "accent", reject: "bad", remove: "bad" }[e.action] || "")),
    el("td", { class: "mono" }, e.target || ""),
    el("td", {}, e.detail || "")), e.moderator, e.action, e.target, e.detail));
  return el("div", {}, toolbar(r),
    rows.length
      ? el("div", { class: "table-wrap" }, el("table", {},
          el("thead", {}, el("tr", {}, ...["When", "Who", "What", "Target", "Detail"].map((h) => el("th", {}, h)))),
          el("tbody", {}, ...rows)))
      : empty(reads ? "No reads by read-only keys yet." : "No decisions yet."));
}

function releaseCard() {
  const name = el("input", { placeholder: "Offline name, like Mr_ODS", maxlength: "16", "aria-label": "Offline name" });
  const go = el("button", { class: "small" }, "Release");
  go.onclick = async () => {
    const who = name.value.trim();
    if (!who) return;
    if (!(await sure("Release " + who + "?", "Whoever's launcher signs in with this name next claims it. Use it for a player who lost their PC's key and recovery code; their profile and friends stay.", "Release"))) return;
    const ok = await act(go, () => api("/v1/admin/names/release", { method: "POST", body: { name: who } }), "Released: " + who);
    if (ok) name.value = "";
  };
  return el("div", { class: "card", style: "margin-top:12px;max-width:420px" },
    el("h3", {}, "Release an offline name"),
    el("div", { class: "meta" }, "For a player whose launcher lost its key (\"this name is used by another Arctic player\") and has no recovery code."),
    el("div", { class: "actions", style: "margin-top:8px" }, name, go));
}

async function overview(r) {
  const data = await api("/v1/admin/stats");
  const c = data.counts || {};
  const d = data.downloads;
  const tile = (label, value, note) => el("div", { class: "card" },
    el("div", { class: "meta" }, label), el("h3", { style: "font-size:26px" }, value), note ? el("div", { class: "meta" }, note) : null);
  const downloads = d
    ? [tile("Launcher downloads", fmt(d.launcher.total), "every download of every release file, so not unique people"),
       tile("Polarium downloads", fmt(d.polarium.total), "same: every download counts")]
    : [tile("Downloads", "unavailable", "GitHub didn't answer; try again in a minute")];
  return el("div", {},
    el("div", { class: "grid" },
      tile("Accounts known", fmt(c.accounts), "Minecraft accounts that ever saved their looks here"),
      tile("Active in 30 days", fmt(c.accounts_30d), fmt(c.accounts_7d) + " in the last 7 days"),
      tile("Friends profiles", fmt(c.profiles)),
      tile("Crash reports", fmt(c.crash_reports)),
      ...downloads,
      tile("Launcher opens", "not tracked", "the launcher never tells this server when it starts")),
    canChange() ? releaseCard() : null);
}

const VIEWS = { gallery, servers, suggestions, crashes, overview, history };

// ---- start ---------------------------------------------------------------

try { applyTheme(safeStorage("local")?.getItem(THEME) || "auto"); } catch (_) { /* default theme */ }

document.addEventListener("keydown", (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "") || document.querySelector("dialog[open]");
  if (typing || e.ctrlKey || e.metaKey || e.altKey || !me) return;
  if (e.key === "/") { const s = document.querySelector("input.search"); if (s) { e.preventDefault(); s.focus(); } }
  else if (e.key === "r") render();
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refreshCounts(); });
setInterval(() => { if (document.visibilityState === "visible") refreshCounts(); }, COUNTS_EVERY_MS);

render();
</script>
</body>
</html>
