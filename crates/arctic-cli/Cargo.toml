[package]
name = "arctic-cli"
description = "Arctic Launcher command line interface (headless)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
arctic-core = { version = "0.2.0", path = "../arctic-core" }
arctic-share = { version = "0.2.0", path = "../arctic-share" }
clap = { version = "4.6.7", features = ["derive", "env"] }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[features]
# Offline (username-only) accounts. Off in release builds for now.
offline-accounts = []

[[bin]]
name = "arctic"
path = "src/main.rs"
