[package]
name = "arctic-core"
description = "Core library for Arctic Launcher: auth, versions, Java runtimes, launching, updates."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
arctic-ping = { path = "../arctic-ping" }
base64 = "0.23.1"
dirs = "7.0.0"
flate2 = "1.1.10"
hex = "0.4.3"
log = "0.4.34"
lzma-rs = "0.3.0"
md-5 = "0.11.0"
open = "5.4.4"
png = "0.18.1"
self-replace = "1.5.0"
semver = "1.0.28"
rusqlite = { version = "0.40.2", features = ["bundled"] }
zeroize = "1.9"
regex = "1.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.21"
ureq = { version = "3.4.2", features = ["json", "platform-verifier", "socks-proxy"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
junction = "2.1.0"
windows-sys = { version = "0.61.2", features = ["Win32_System_SystemInformation", "Win32_System_Time", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[target."cfg(not(windows))".dependencies]
aes-gcm = "0.10"
getrandom = "0.3"

[build-dependencies]
lzma-rs = "0.3.0"
serde_json = "1.0.151"

[dev-dependencies]
env_logger = "0.11.11"
tempfile = "3.27.0"

[features]
# Offline (username-only) accounts. Left out of release builds entirely for now.
offline-accounts = []

[[example]]
name = "smoke_launch"
required-features = ["offline-accounts"]

[[example]]
name = "loader_smoke"
required-features = ["offline-accounts"]
